<title>Beehive Home Kochi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Key Tags — each apartment is a coloured hotel key tag; white rounded cards on a cool grey ground; sidebar on desktop, floating bottom bar on phones */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F4F5F8; --ink:#15171C; --muted:#555B66; --line:#DFE2E8;
  --teal:#4646E0; --teal-ink:#FFFFFF; --teal-soft:#E5E5FB;
  --honey:#FFC542; --honey-soft:#FFF3D1; --on-honey:#15171C;
  --tag1:#FFC542; --tag1-ink:#15171C; --tag2:#4646E0; --tag2-ink:#FFFFFF; --tag3:#1F7A6C; --tag3-ink:#FFFFFF; --tag4:#B0306A; --tag4-ink:#FFFFFF;
  --airbnb:#B8323F; --airbnb-soft:#FCE4E6; --booking:#2449A8; --booking-soft:#E2E9FA;
  --direct:#7A5200; --direct-soft:#FFF0C7; --other:#555B66; --other-soft:#EBEDF1;
  --ok:#1F6B42; --ok-soft:#E3F5EA; --warn:#7E5300; --warn-soft:#FFF0C7; --bad:#B42328; --bad-soft:#FDE4E4; --on-bad:#FFFFFF;
  --info:#3636C4; --info-soft:#E5E5FB;
  --scrim:rgba(14,16,20,.48);
  --shadow:0 2px 4px rgba(21,23,28,.05),0 12px 32px rgba(21,23,28,.12);
  --tagshadow:0 6px 16px rgba(21,23,28,.14);
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#171A20; --surface-2:#1F232A; --ink:#EEF0F4; --muted:#9BA2AE; --line:#2A2F38;
  --teal:#9A9AFF; --teal-ink:#0E1014; --teal-soft:#24254A;
  --honey:#FFC542; --honey-soft:#3A2F10; --on-honey:#15171C;
  --tag1:#FFC542; --tag1-ink:#15171C; --tag2:#5B5BF2; --tag2-ink:#FFFFFF; --tag3:#2A9A88; --tag3-ink:#06201C; --tag4:#D2468A; --tag4-ink:#FFFFFF;
  --airbnb:#FF8A96; --airbnb-soft:#3B1A1F; --booking:#93B2FF; --booking-soft:#1A2440;
  --direct:#F5C24A; --direct-soft:#3A2F10; --other:#A9B0BB; --other-soft:#252A32;
  --ok:#5BD08E; --ok-soft:#14301F; --warn:#F5C24A; --warn-soft:#3A2F10; --bad:#FF7B7F; --bad-soft:#3D1A1C; --on-bad:#1A0507;
  --info:#9A9AFF; --info-soft:#24254A;
  --scrim:rgba(0,0,0,.64);
  --shadow:0 2px 4px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  --tagshadow:0 6px 16px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A20; --surface-2:#1F232A; --ink:#EEF0F4; --muted:#9BA2AE; --line:#2A2F38;
  --teal:#9A9AFF; --teal-ink:#0E1014; --teal-soft:#24254A;
  --honey:#FFC542; --honey-soft:#3A2F10; --on-honey:#15171C;
  --tag1:#FFC542; --tag1-ink:#15171C; --tag2:#5B5BF2; --tag2-ink:#FFFFFF; --tag3:#2A9A88; --tag3-ink:#06201C; --tag4:#D2468A; --tag4-ink:#FFFFFF;
  --airbnb:#FF8A96; --airbnb-soft:#3B1A1F; --booking:#93B2FF; --booking-soft:#1A2440;
  --direct:#F5C24A; --direct-soft:#3A2F10; --other:#A9B0BB; --other-soft:#252A32;
  --ok:#5BD08E; --ok-soft:#14301F; --warn:#F5C24A; --warn-soft:#3A2F10; --bad:#FF7B7F; --bad-soft:#3D1A1C; --on-bad:#1A0507;
  --info:#9A9AFF; --info-soft:#24254A;
  --scrim:rgba(0,0,0,.64);
  --shadow:0 2px 4px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  --tagshadow:0 6px 16px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{text-wrap:balance}
.shell{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 128px}
.topbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:6px 18px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.logo{width:38px;height:44px;border-radius:12px;background:var(--tag1);display:flex;justify-content:center;padding-top:6px;flex:none;transform:rotate(-6deg);box-shadow:var(--tagshadow)}
.logo i{width:11px;height:11px;border-radius:50%;background:var(--bg);border:2.5px solid var(--tag1-ink)}
.bname{font:800 21px/1.1 var(--f-display);letter-spacing:-.02em}
.bsub{color:var(--muted);font-size:13px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.side{display:none}
.mnav{display:none}
.bottombar{position:fixed;z-index:40;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--ink);border-radius:24px;padding:8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;box-shadow:var(--shadow)}
.bb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;border-radius:18px;background:transparent;color:var(--bg);font:600 10.5px var(--f-body);cursor:pointer;position:relative}
.bb[aria-current="page"]{background:var(--tag1);color:var(--tag1-ink)}
.bb .count{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;padding:0 5px;font-size:10px;background:var(--bad);color:var(--on-bad)}
@media (min-width:960px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;max-height:calc(100vh - 24px);overflow:auto;padding:12px 10px;background:var(--surface);border-radius:24px}
  .bottombar{display:none}
  .shell{padding-block:14px 64px}
}
.navgroup{margin-bottom:12px}
.navgroup h4{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 6px 12px}
.navitem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 12px;border-radius:14px;border:0;background:none;color:var(--ink);font:500 14px var(--f-body);cursor:pointer;text-align:left;min-height:40px}
.navitem:hover{background:var(--surface-2)}
.navitem[aria-current="page"]{background:var(--ink);color:var(--surface)}
.count{display:inline-block;font-size:11.5px;font-weight:700;min-width:20px;padding:1px 7px;border-radius:99px;background:var(--honey);color:var(--on-honey);text-align:center;font-variant-numeric:tabular-nums}
#main{display:grid;gap:18px;min-width:0}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vhead h2{font:800 25px/1.15 var(--f-display);letter-spacing:-.025em;margin:0}
.vhead .sub{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:65ch}
.vacts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;min-height:42px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);font:600 13.5px/1.2 var(--f-body);cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.btn:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);box-shadow:none}
.btn.primary:hover{opacity:.9}
.btn.honey{background:var(--tag1);color:var(--tag1-ink);box-shadow:none}
.btn.sm{padding:6px 12px;min-height:34px;font-size:12.5px;border-radius:11px}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);line-height:1.5}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.honey{background:var(--honey-soft);color:var(--warn)}
.ch-airbnb{background:var(--airbnb-soft);color:var(--airbnb)} .ch-booking{background:var(--booking-soft);color:var(--booking)}
.ch-direct{background:var(--direct-soft);color:var(--direct)} .ch-other{background:var(--other-soft);color:var(--other)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.panel{background:var(--surface);border-radius:24px;padding:18px;min-width:0}
.panel>h3{font:700 15px/1.3 var(--f-display);letter-spacing:-.01em;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel .note{color:var(--muted);font-size:13px;margin:0 0 10px}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.stat{background:var(--surface);border-radius:20px;padding:14px 16px;min-width:0}
.panel .stat{background:var(--surface-2)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font:800 21px/1.3 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--muted)}
.v.pos{color:var(--ok)} .v.neg{color:var(--bad)}
.list{background:var(--surface);border-radius:24px;min-width:0;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:15px 18px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .s{color:var(--muted);font-size:13px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
.item .money{text-align:right;font-variant-numeric:tabular-nums}
.item .money strong{display:block;font:800 15px var(--f-display);letter-spacing:-.01em}
.item .money span{font-size:12px;color:var(--muted)}
.item.clickable{cursor:pointer} .item.clickable:hover{background:var(--surface-2)}
@media (max-width:640px){.item{grid-template-columns:minmax(0,1fr)} .item .acts{justify-content:flex-start} .item .money{text-align:left}}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbtn{padding:8px 14px;min-height:38px;border-radius:99px;border:0;background:var(--surface);color:var(--ink);font:600 13px var(--f-body);cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{max-width:300px}
.empty{padding:30px 22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:24px;background:var(--surface)}
.empty h3{font:700 16px var(--f-display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 14px;max-width:52ch}
.banner{padding:12px 16px;border-radius:16px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;margin-bottom:14px;font-weight:500}
.allclear{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13.5px;background:var(--surface);border-radius:18px;padding:12px 16px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface-2);flex-wrap:wrap}
.alert .txt{flex:1;min-width:180px;font-size:13.5px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;border-radius:16px;background:var(--surface);border:0;color:var(--muted);font:500 11px var(--f-body);cursor:pointer;min-height:62px}
.wday b{font:700 16px var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.wday.on{background:var(--ink);color:var(--surface)} .wday.on b{color:var(--surface)}
.wday .dots{display:flex;gap:3px;height:6px}
.wday .dots i{width:6px;height:6px;border-radius:2px}
.tags{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.keytag{background:var(--surface);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--tagshadow)}
.kt-top{padding:16px 18px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;position:relative}
.kt-hole{position:absolute;top:14px;left:50%;margin-left:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid currentColor}
.kt-code{font:800 34px/1.05 var(--f-display);letter-spacing:-.04em;margin-top:18px}
.kt-name{font-size:13px;font-weight:600;opacity:.85}
.kt-state{grid-column:2;grid-row:1/span 2;align-self:end;font:700 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--surface);color:var(--ink);white-space:nowrap}
.kt-body{padding:14px 18px 16px;display:grid;gap:12px}
.feat{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.feat span{font-size:11.5px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.28);font-weight:600}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.agenda{display:grid;gap:14px}
.agenda .day{display:grid;gap:8px}
.agenda .dname{font:700 13px var(--f-display);letter-spacing:-.01em}
.agenda .dname small{font:400 12px var(--f-body);color:var(--muted);margin-left:6px}
.arow{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:16px;padding:9px 12px}
.tchip{font:700 12.5px var(--f-body);background:var(--surface);border-radius:11px;padding:7px 0;width:62px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.arow .at{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13.5px}
.arow .at b{font-weight:600}
.arow .at span{font-size:12px;color:var(--muted)}
.sq{width:11px;height:11px;border-radius:3px;flex:none}
.ev{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:3px 0;font-size:13.5px}
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-nav strong{font:700 16px var(--f-display);letter-spacing:-.01em;min-width:170px;text-align:center}
.cal-wrap{overflow-x:auto;border-radius:24px;background:var(--surface)}
.cal{display:grid;width:max-content}
.cal .lab{position:sticky;left:0;z-index:3;background:var(--surface);padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font:700 13px var(--f-display);display:flex;flex-direction:column;justify-content:center;gap:2px}
.cal .lab small{font:400 11.5px var(--f-body);color:var(--muted);display:flex;align-items:center;gap:6px}
.cal .dh{font-size:10.5px;text-align:center;padding:7px 0;color:var(--muted);border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.cal .we{background:var(--surface-2)}
.cal .dh.today{background:var(--ink);color:var(--surface)} .cal .dh.today b{color:var(--surface)}
.cal .cell{border:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;min-height:62px;cursor:pointer;padding:0}
.cal .cell.we{background:var(--surface-2)}
.cal .cell.today{background:var(--honey-soft)}
.cal .cell:hover{background:var(--teal-soft)}
.bar{position:relative;z-index:2;align-self:center;margin:0 2px;height:44px;border-radius:12px;padding:5px 9px;font:600 12px/1.25 var(--f-body);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left}
.bar small{display:block;font-weight:500;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.task{background:var(--surface);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.task .band{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.task .band .bt{display:flex;flex-direction:column;gap:1px;min-width:0}
.task .band .bt span{font:700 11.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase}
.task .band .bt b{font:800 24px/1.1 var(--f-display);letter-spacing:-.03em}
.task .band .pill{background:var(--surface);color:var(--ink)}
.task .band .pill.bad{background:var(--bad);color:var(--on-bad)}
.task .tb{padding:14px 18px 16px;display:grid;gap:10px}
.task.overdue{box-shadow:0 0 0 2px var(--bad)}
.when{font-weight:700;font-size:13.5px}
.detail{font-size:13.5px;color:var(--ink)}
.detail .muted{font-size:13px}
.prog{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:99px}
.checklist{display:grid;gap:6px;margin:2px 0}
.checkrow{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--ink);font-weight:500;padding:8px 12px;cursor:pointer;min-height:44px;border-radius:14px}
.checklist .checkrow{background:var(--surface-2)}
.checkrow input{width:21px;height:21px;flex:none;accent-color:var(--teal);margin:0}
.checklist input:checked+span{text-decoration:line-through;color:var(--muted)}
.tacts{display:flex;gap:8px;flex-wrap:wrap}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .grid-l{stroke:var(--line)}
.hbar{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .track{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--tag1);border-radius:99px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sw.a{background:var(--tag2)} .sw.b{background:var(--tag1)}
.big{font:800 32px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:28px;width:100%;max-width:700px;box-shadow:var(--shadow)}
@media (max-width:560px){
  .modal{align-items:flex-end;padding:calc(40px + env(safe-area-inset-top,0px)) 0 0}
  .sheet{border-radius:28px 28px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 12px}
.sheet-head h2{font:800 19px/1.2 var(--f-display);letter-spacing:-.02em;margin:0}
.x{border:0;background:var(--surface-2);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.sheet-body{padding:6px 20px 16px;display:grid;gap:14px}
.sheet-foot{display:flex;gap:8px;align-items:center;padding:14px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.grow{flex:1}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.fgrid,.fgrid.c4{grid-template-columns:minmax(0,1fr)}}
@media (min-width:561px) and (max-width:700px){.fgrid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;border:0;padding:0;margin:0}
.field.w2{grid-column:1/-1}
.field>label,.field>legend{font-size:12.5px;font-weight:600;color:var(--muted);padding:0}
.field legend{margin-bottom:6px}
.req{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:13px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;background:var(--surface)}
textarea{resize:vertical}
.segc{display:flex;flex-wrap:wrap;gap:6px}
.segopt{position:relative}
.segopt input{position:absolute;opacity:0;pointer-events:none}
.segopt span{display:inline-block;padding:9px 15px;border-radius:99px;background:var(--surface-2);cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink)}
.segopt input:checked+span{background:var(--ink);color:var(--surface)}
.segopt input:focus-visible+span{outline:3px solid var(--teal);outline-offset:2px}
.formwarn{padding:11px 14px;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-size:13.5px}
.formnote{padding:11px 14px;border-radius:14px;background:var(--surface-2);font-size:13.5px}
.subhead{font:700 12.5px var(--f-display);letter-spacing:-.005em;color:var(--ink);margin:6px 0 0}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:min(92vw,420px)}
@media (min-width:960px){.toasts{bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:16px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:var(--on-bad)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13.5px}
.inv-row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.inv-row:first-child{border-top:0}
a{color:var(--teal)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}.logo{transform:none}}

<script>
(function(){
'use strict';
/* ---------- constants ---------- */
const TZ='Asia/Kolkata';
const CHANNELS={airbnb:'Airbnb',booking:'Booking.com',direct:'Direct',other:'Other'};
const PAY={channel:'Paid via channel',paid:'Paid to me',partial:'Part paid',pending:'Payment pending'};
const BSTAT={confirmed:'Confirmed',checked_in:'Checked in',checked_out:'Checked out',cancelled:'Cancelled'};
const DEP={none:'No deposit',held:'Deposit held',refunded:'Deposit refunded',deducted:'Deposit deducted'};
const TTYPE={turnover:'Turnover clean',arrival:'Guest arrival',deep:'Deep clean',inspection:'Inspection',maintenance:'Maintenance visit',laundry:'Laundry',other:'Other job'};
const MANUAL_T={deep:'Deep clean',inspection:'Inspection',maintenance:'Maintenance visit',laundry:'Laundry',other:'Other job'};
const ICAT={maintenance:'General repair',electrical:'Electrical',plumbing:'Plumbing',appliance:'Appliance / AC',hygiene:'Hygiene',supplies:'Supplies low',damage:'Damage',missing:'Missing item / theft',mess:'Room left messy',other:'Other'};
const PRIO={low:'Low',normal:'Normal',urgent:'Urgent'};
const SCAT={hygiene:'Hygiene inspection',airfilter:'AC / air filter',purifier:'Water purifier',watertest:'Water testing',deepclean:'Deep clean',acservice:'AC service',pest:'Pest control',safety:'Safety check',other:'Other'};
const WHO={housekeeper:'Housekeeper',technician:'Technician / vendor',owner:'Owner'};
const EXPC={electricity:'Electricity',water:'Water',internet:'Internet & TV',association:'Association fee',repairs:'Repairs & maintenance',supplies:'Supplies & toiletries',laundry:'Laundry',wages:'Housekeeping wages',cleaning:'Cleaning & pest control',gas:'Cooking gas',taxes:'Taxes & licences',marketing:'Marketing',assets:'Furniture & assets',bank:'Bank & payment fees',other:'Other'};
const PCAT={supplies:'Supplies',laundry:'Laundry',cleaning:'Cleaning',repairs:'Small repairs',transport:'Transport',guest:'Guest needs',other:'Other'};
const PAYVIA={upi:'UPI',cash:'Cash',bank:'Bank transfer',card:'Card'};
const ACAT={appliance:'Appliance',electronics:'Electronics',furniture:'Furniture',linen:'Linen & towels',kitchen:'Kitchen',bathroom:'Bathroom',decor:'Decor',safety:'Safety',other:'Other'};
const LSTAT={live:'Live',paused:'Paused',draft:'Draft'};
const MCH={all:'All channels',airbnb:'Airbnb',booking:'Booking.com',direct:'Direct',instagram:'Instagram',whatsapp:'WhatsApp',google:'Google'};
const XUNIT={use:'per use',day:'per day',night:'per night',hour:'per hour',event:'per event',item:'per item'};
const XUNITN={use:'uses',day:'days',night:'nights',hour:'hours',event:'times',item:'items'};
const XSTAT={requested:'Requested',confirmed:'Confirmed',delivered:'Given to guest',returned:'Returned',cancelled:'Cancelled'};
const CHARGE_NAME={mess:'Extra cleaning charge',missing:'Missing items charge',damage:'Damage charge'};
const GTAG={none:'No tag',repeat:'Repeat guest',vip:'VIP',blocked:'Do not host'};
const SHARED=['tasks','issues','schedules','schedlog','assets','laundry','petty','extras'];
const PRIVATE=['bookings','guests','foreign','expenses','licences','listings','campaigns'];
const DEFAULT_WELCOME='Hello {guest}, welcome to Beehive Home! Your stay at our {apartment} in Panampilly Nagar, Kochi is confirmed for {checkin} to {checkout}. Check-in is from {checkinTime} and check-out is by {checkoutTime}. Please send a photo ID for each adult before arrival. Message me here anytime if you need anything.';

const NAV_OWNER=[
  ['Overview',[['today','Today'],['calendar','Calendar']]],
  ['Guests',[['bookings','Bookings'],['guests','Guests'],['foreign','Foreign guests'],['extras','Paid extras']]],
  ['Property care',[['jobs','Housekeeping'],['schedule','Periodic care'],['laundry','Laundry'],['issues','Maintenance'],['assets','Assets & inventory']]],
  ['Money',[['finance','Finance'],['expenses','Expenses'],['petty','Petty cash']]],
  ['Business',[['marketing','Marketing'],['licences','Licences'],['apartments','Apartments']]]
];
const NAV_HK=[
  ['Work',[['jobs','My jobs'],['schedule','Periodic care'],['laundry','Laundry']]],
  ['Records',[['issues','Maintenance'],['petty','Petty cash'],['assets','Assets & inventory'],['apartments','Apartments']]]
];

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function d2u(s){const p=String(s).split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function u2d(u){return new Date(u).toISOString().slice(0,10);}
function addDays(s,n){return u2d(d2u(s)+n*864e5);}
function diffDays(a,b){return Math.round((d2u(b)-d2u(a))/864e5);}
const _fd=new Intl.DateTimeFormat('en-IN',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short'});
const _fdy=new Intl.DateTimeFormat('en-IN',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'});
const _fl=new Intl.DateTimeFormat('en-IN',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'});
const _ft=new Intl.DateTimeFormat('en-IN',{timeZone:TZ,day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const _clk=new Intl.DateTimeFormat('en-IN',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function okDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);}
function fday(s){return okDate(s)?_fd.format(new Date(d2u(s))):'';}
function fdy(s){return okDate(s)?_fdy.format(new Date(d2u(s))):'';}
function longDate(s){return _fl.format(new Date(d2u(s)));}
function rday(s){if(!okDate(s))return'';const t=today();if(s===t)return'Today';if(s===addDays(t,1))return'Tomorrow';if(s===addDays(t,-1))return'Yesterday';return fday(s);}
function fdt(ms){return ms?_ft.format(new Date(ms)):'';}
function ftime(t){if(!t)return'';let[h,m]=String(t).split(':').map(Number);if(isNaN(h))return'';const ap=h>=12?'PM':'AM';h=h%12||12;return h+(m?':'+String(m).padStart(2,'0'):'')+' '+ap;}
const _inr=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
function money(n){return _inr.format(Math.round(Number(n)||0));}
function compact(n){n=Math.round(n||0);const a=Math.abs(n);if(a>=1e5)return'₹'+(n/1e5).toFixed(a%1e5===0?0:1)+'L';if(a>=1e3)return'₹'+(n/1e3).toFixed(a%1e3===0?0:1)+'k';return'₹'+n;}
function pct(x){return Math.round((x||0)*100)+'%';}
function monthLabel(k){const[y,m]=k.split('-').map(Number);return new Intl.DateTimeFormat('en-IN',{timeZone:'UTC',month:'long',year:'numeric'}).format(new Date(Date.UTC(y,m-1,1)));}
function monthShort(k){const[y,m]=k.split('-').map(Number);return new Intl.DateTimeFormat('en-IN',{timeZone:'UTC',month:'short'}).format(new Date(Date.UTC(y,m-1,1)));}
function addMonths(k,n){let[y,m]=k.split('-').map(Number);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+String(m).padStart(2,'0');}
function daysIn(k){const[y,m]=k.split('-').map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate();}
function guestsOf(b){return(Number(b.adults)||0)+(Number(b.children)||0);}
function nightsOf(b){return okDate(b.checkIn)&&okDate(b.checkOut)?Math.max(0,diffDays(b.checkIn,b.checkOut)):0;}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||'there';}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function stripId(o){const r={};for(const k in o){if(k!=='id')r[k]=o[k];}return r;}
function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v);}
function merge(a,b){const r={...a};for(const k in b){r[k]=isObj(b[k])&&isObj(a[k])?merge(a[k],b[k]):b[k];}return r;}
function waLink(phone,text){let d=String(phone||'').replace(/\D/g,'');if(!d)return'';if(d.length===11&&d[0]==='0')d=d.slice(1);if(d.length===10)d='91'+d;return'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):'');}
function guestKey(b){const d=String(b.phone||'').replace(/\D/g,'');let k;if(d.length>=8)k='p'+d.slice(-10);else if(b.email)k='e'+String(b.email).toLowerCase();else k='n'+String(b.guestName||'guest').toLowerCase().trim();return('g-'+k).replace(/[^A-Za-z0-9_\-.~:@+]/g,'-').slice(0,120);}

/* ---------- state ---------- */
const S={view:null,props:{},loaded:{},errors:{},isOwner:false,canWrite:null,myId:null,user:null,db:null,downloads:null,
  roleReady:false,preview:false,stale:false,noDb:false,readOnly:false,
  calMonth:today().slice(0,7),finMonth:today().slice(0,7),expMonth:today().slice(0,7),
  bFilter:'current',bSearch:'',gSearch:'',jFilter:'open',iFilter:'open',lFilter:'out',aFilter:'all',
  open:new Set(),drafts:{},schedOpen:new Set()};
SHARED.concat(PRIVATE).forEach(c=>{S[c]=[];});
const mgr=()=>S.isOwner&&!S.preview;
const canW=()=>S.isOwner||(S.canWrite!==false&&!S.readOnly);
function propList(){return Object.values(S.props).sort((a,b)=>((a.order??99)-(b.order??99))||String(a.name).localeCompare(String(b.name)));}
function pname(id){if(!id||id==='both')return'Both apartments';const p=S.props[id];return p?(p.code||p.name):'Apartment';}
function pfull(id){if(!id||id==='both')return'Both apartments';return S.props[id]?.name||'Apartment';}
function active(){return S.bookings.filter(b=>b.status!=='cancelled');}
function findRec(c,id){return c==='properties'?S.props[id]:(S[c]||[]).find(x=>x.id===id);}
function fRec(bid){return S.foreign.find(x=>x.id===bid);}
function gProfile(key){return S.guests.find(x=>x.id===key);}
function isBlocked(b){return gProfile(guestKey(b))?.tag==='blocked';}
function extrasOf(b){return(b.extras||[]).filter(x=>x.status!=='cancelled');}
function exTotal(b){return extrasOf(b).reduce((s,x)=>s+(+x.total||0),0);}
function tagOf(pid){const i=propList().findIndex(p=>p.id===pid);const n=(i<0?0:i)%4+1;return{bg:'var(--tag'+n+')',fg:'var(--tag'+n+'-ink)'};}
const svg=d=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON={home:svg('<path d="M4 11 12 4l8 7v9H4z"/>'),cal:svg('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'),book:svg('<path d="M6 4h12v16l-6-4-6 4z"/>'),jobs:svg('<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>'),drop:svg('<path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/>'),wash:svg('<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="4.5"/>'),warn:svg('<path d="M12 4 3 20h18L12 4z"/><path d="M12 10v4M12 17v.5"/>'),more:svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>')};
const BB_OWNER=[['today','Today','home'],['calendar','Calendar','cal'],['bookings','Bookings','book'],['jobs','Jobs','jobs'],['more','More','more']];
const BB_HK=[['jobs','Jobs','jobs'],['schedule','Care','drop'],['laundry','Laundry','wash'],['issues','Report','warn'],['more','More','more']];

/* ---------- writes ---------- */
const chains=new Map();
function q(path,fn){const prev=chains.get(path)||Promise.resolve();const p=prev.catch(()=>{}).then(fn);chains.set(path,p);return p;}
const qSet=(p,d)=>q(p,()=>S.db.doc(p).set(d));
const qUpdate=(p,d)=>q(p,()=>S.db.doc(p).update(d));
const qDel=p=>q(p,()=>S.db.doc(p).delete());
function writeErr(e){
  console.error(e);
  const c=e&&e.code;
  if(c==='invalid_argument'){if(!S.isOwner)S.readOnly=true;toast("You don't have permission to change this.",'bad');render();}
  else if(c==='quota_exceeded')toast('Storage is full. Delete old records to add more.','bad');
  else if(c==='revoked')toast('Your access to this page changed. Reload to continue.','bad');
  else toast('Could not save. Check your connection and try again.','bad');
}
function upsertLocal(c,id,doc){const row={...doc,id};if(c==='properties')S.props[id]=row;else{const a=S[c].slice();const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=row;else a.push(row);S[c]=a;}scheduleRender();}
function patchLocal(c,id,patch){const r=findRec(c,id);if(r)upsertLocal(c,id,merge(stripId(r),patch));}
function removeLocal(c,id){if(c==='properties'){const p={...S.props};delete p[id];S.props=p;}else S[c]=S[c].filter(x=>x.id!==id);scheduleRender();}
async function saveDoc(c,id,doc){await qSet(c+'/'+id,doc);upsertLocal(c,id,doc);}
async function patchDoc(c,id,patch){try{await qUpdate(c+'/'+id,patch);patchLocal(c,id,patch);return true;}catch(e){writeErr(e);return false;}}
async function deleteRecord(c,id){try{await qDel(c+'/'+id);removeLocal(c,id);closeSheet();toast('Deleted');if(c==='bookings')await syncTasks();}catch(e){writeErr(e);}}

/* ---------- housekeeping jobs generated from bookings ---------- */
function desiredTasks(){
  const out={};const floor=addDays(today(),-2);const act=active();
  for(const b of act){
    if(!okDate(b.checkIn)||!okDate(b.checkOut))continue;
    const pid=b.propertyId;
    if(b.checkOut>=floor){
      const next=act.filter(x=>x.propertyId===pid&&x.id!==b.id&&x.checkIn>=b.checkOut).sort((x,y)=>x.checkIn<y.checkIn?-1:1)[0];
      out['turn-'+b.id]={type:'turnover',propertyId:pid,bookingId:b.id,date:b.checkOut,time:b.checkOutTime||'11:00',guestName:b.guestName||'',guestsOut:guestsOf(b),
        nextArrival:next?next.checkIn:null,nextArrivalTime:next?(next.checkInTime||'14:00'):null,nextGuests:next?guestsOf(next):null,note:b.hkNote||'',extrasReturn:extrasOf(b).filter(x=>S.extras.find(e=>e.id===x.extraId)?.returnCheck).map(x=>x.name)};
    }
    if(b.checkIn>=floor){
      out['arr-'+b.id]={type:'arrival',propertyId:pid,bookingId:b.id,date:b.checkIn,time:b.checkInTime||'14:00',guestName:b.guestName||'',guests:guestsOf(b),
        phone:b.sharePhone===false?'':(b.phone||''),channel:b.channel||'other',foreign:!!b.foreignNational,note:b.hkNote||'',extras:extrasOf(b).filter(x=>x.extraId).map(x=>(x.qty>1?x.qty+'× ':'')+x.name)};
    }
  }
  return out;
}
let syncing=Promise.resolve();
function syncTasks(){syncing=syncing.catch(()=>{}).then(doSync);return syncing;}
async function doSync(){
  if(!S.db||!S.isOwner)return;
  const want=desiredTasks();const now=Date.now();
  try{
    for(const id of Object.keys(want)){
      const d=want[id];const h=S.tasks.find(t=>t.id===id);
      if(!h){const doc={...d,status:'pending',checks:{},createdAt:now};await saveDoc('tasks',id,doc);}
      else{const diff={};for(const k in d){if(JSON.stringify(h[k]??null)!==JSON.stringify(d[k]??null))diff[k]=d[k];}
        if(Object.keys(diff).length){await qUpdate('tasks/'+id,diff);patchLocal('tasks',id,diff);}}
    }
    for(const t of S.tasks.slice()){
      if(!/^(turn|arr)-/.test(t.id)||want[t.id]||t.status==='done')continue;
      const b=S.bookings.find(x=>x.id===t.bookingId);
      if(!b||b.status==='cancelled'){await qDel('tasks/'+t.id);removeLocal('tasks',t.id);}
    }
  }catch(e){writeErr(e);}
}

/* ---------- money ---------- */
function alloc(){
  const M={};
  for(const b of active()){
    const n=nightsOf(b);if(!n)continue;const g=(+b.total||0)/n,c=(+b.commission||0)/n,ch=CHANNELS[b.channel]?b.channel:'other';
    for(let i=0;i<n;i++){const k=addDays(b.checkIn,i).slice(0,7);const m=M[k]||(M[k]={props:{},ch:{}});
      const pp=m.props[b.propertyId]||(m.props[b.propertyId]={n:0,g:0,c:0});pp.n++;pp.g+=g;pp.c+=c;
      const cc=m.ch[ch]||(m.ch[ch]={n:0,g:0,c:0,ids:new Set()});cc.n++;cc.g+=g;cc.c+=c;cc.ids.add(b.id);}
  }
  return M;
}
function finance(mk,A){
  A=A||alloc();const props=propList();const M=A[mk]||{props:{},ch:{}};const days=daysIn(mk);
  const r={gross:0,comm:0,nights:0,exp:0,petty:0,perProp:{},byCat:{},byCh:M.ch};
  props.forEach(p=>{const x=M.props[p.id]||{n:0,g:0,c:0};r.perProp[p.id]={nights:x.n,gross:x.g,comm:x.c,exp:0,extras:0,occ:x.n/days};r.gross+=x.g;r.comm+=x.c;r.nights+=x.n;});
  const split=(pid,a)=>{if(pid&&r.perProp[pid])r.perProp[pid].exp+=a;else if(props.length)props.forEach(p=>{r.perProp[p.id].exp+=a/props.length;});};
  S.expenses.filter(e=>String(e.date||'').startsWith(mk)).forEach(e=>{const a=+e.amount||0;r.exp+=a;const c=EXPC[e.category]||'Other';r.byCat[c]=(r.byCat[c]||0)+a;split(e.propertyId,a);});
  S.petty.filter(e=>e.type!=='in'&&String(e.date||'').startsWith(mk)).forEach(e=>{const a=+e.amount||0;r.petty+=a;const c='Petty cash: '+(PCAT[e.category]||'Other');r.byCat[c]=(r.byCat[c]||0)+a;split(e.propertyId,a);});
  r.extras=0;active().forEach(b=>extrasOf(b).forEach(x=>{if(String(x.date||b.checkIn||'').startsWith(mk)){const a=+x.total||0;r.extras+=a;if(r.perProp[b.propertyId])r.perProp[b.propertyId].extras+=a;}}));
  r.net=r.gross-r.comm;r.income=r.net+r.extras;r.totalExp=r.exp+r.petty;r.profit=r.income-r.totalExp;r.occ=props.length?r.nights/(days*props.length):0;r.adr=r.nights?r.gross/r.nights:0;
  return r;
}
function pettyBalance(){return S.petty.reduce((s,e)=>s+(e.type==='in'?1:-1)*(+e.amount||0),0);}

/* ---------- statuses ---------- */
function schedNext(s){return okDate(s.lastDone)?addDays(s.lastDone,Math.max(1,+s.everyDays||30)):null;}
function schedStatus(s){const n=schedNext(s);const T=today();if(!n)return['Set last done date','warn',1];const d=diffDays(T,n);
  if(d<0)return['Overdue by '+plural(-d,'day'),'bad',0];if(d===0)return['Due today','warn',1];if(d<=7)return['Due '+rday(n),'warn',2];return['Next '+fday(n),'ok',3];}
function licStatus(l){if(!okDate(l.expires))return['No expiry date','',2];const d=diffDays(today(),l.expires);
  if(d<0)return['Expired '+fdy(l.expires),'bad',0];if(d<=(+l.remindDays||60))return['Renew by '+fdy(l.expires)+' ('+plural(d,'day')+')','warn',1];return['Valid until '+fdy(l.expires),'ok',3];}
function taskList(t){const p=S.props[t.propertyId]||{};if(t.type==='turnover'||t.type==='deep')return p.cleaningChecklist||[];if(t.type==='arrival')return p.arrivalChecklist||[];return[];}
function countable(pid){return S.assets.filter(a=>a.propertyId===pid&&a.checkOnTurnover);}

/* ---------- small renderers ---------- */
function vhead(title,sub,actions){return `<div class="vhead"><div><h2>${esc(title)}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>${actions?`<div class="vacts">${actions}</div>`:''}</div>`;}
function pill(t,c){return `<span class="pill ${c||''}">${esc(t)}</span>`;}
function chip(ch){const c=CHANNELS[ch]?ch:'other';return `<span class="pill ch-${c}"><span class="dot"></span>${esc(CHANNELS[c])}</span>`;}
function btn(label,act,attrs,cls){return `<button type="button" class="btn ${cls||''}" data-act="${act}" ${attrs||''}>${esc(label)}</button>`;}
function empty(title,body,action){return `<div class="empty"><h3>${esc(title)}</h3><p>${body}</p>${action||''}</div>`;}
function loadingBox(t){return `<div class="empty"><p>${esc(t||'Loading…')}</p></div>`;}
function waiting(...c){return c.some(x=>!S.loaded[x]);}
function filterBar(key,opts){return `<div class="filters" role="group">${Object.entries(opts).map(([k,l])=>`<button type="button" class="fbtn" data-act="filter" data-key="${key}" data-val="${esc(k)}" aria-pressed="${S[key]===k}">${esc(l)}</button>`).join('')}</div>`;}
function monthNav(key){return `<div class="cal-nav">${btn('‹','month',`data-key="${key}" data-d="-1" aria-label="Previous month"`,'sm')}<strong>${esc(monthLabel(S[key]))}</strong>${btn('›','month',`data-key="${key}" data-d="1" aria-label="Next month"`,'sm')}${btn('This month','month',`data-key="${key}" data-d="0"`,'sm ghost')}</div>`;}
function newRec(coll,label,cls,preset){return `<button type="button" class="btn ${cls||''}" data-act="rec-new" data-coll="${coll}"${preset?` data-preset="${esc(JSON.stringify(preset))}"`:''}>${esc(label)}</button>`;}
function editRec(coll,id,label,extra){return `<button type="button" class="btn sm" data-act="rec-edit" data-coll="${coll}" data-id="${esc(id)}" ${extra||''}>${esc(label||'Edit')}</button>`;}
function who(id){return id?`<span data-uid="${esc(id)}">someone</span>`:'someone';}
function bStatusPill(b){const m={confirmed:'info',checked_in:'ok',checked_out:'',cancelled:'bad'};return pill(BSTAT[b.status]||'Confirmed',m[b.status]??'info');}

function alerts(){
  const T=today();const L=[];const add=(lvl,text,b)=>L.push({lvl,text,btn:b});
  for(const b of active()){
    if(!okDate(b.checkIn))continue;
    const live=b.checkIn<=addDays(T,1)&&b.checkOut>=T;
    if(b.foreignNational&&!fRec(b.id)?.formCSubmitted&&b.checkIn<=addDays(T,1)&&b.checkOut>=addDays(T,-1))
      add('bad',`Form C not submitted for ${b.guestName||'foreign guest'} (${pname(b.propertyId)}, arrives ${rday(b.checkIn)}). It is due within 24 hours of arrival.`,btn('Open record','foreign',`data-id="${esc(b.id)}"`,'sm'));
    if(live&&!b.idVerified)add('warn',`ID not verified for ${b.guestName||'guest'} (${pname(b.propertyId)}, ${rday(b.checkIn)}).`,btn('Edit booking','edit-booking',`data-id="${esc(b.id)}"`,'sm'));
    if(b.checkOut>=T&&isBlocked(b))add('bad',`${b.guestName} is tagged "Do not host" and has a booking on ${fday(b.checkIn)}.`,btn('Open booking','edit-booking',`data-id="${esc(b.id)}"`,'sm'));
    if((b.paymentStatus==='pending'||b.paymentStatus==='partial')&&b.checkIn<=addDays(T,3))add('warn',`${PAY[b.paymentStatus]} for ${b.guestName||'guest'} (${fday(b.checkIn)}).`,btn('Edit booking','edit-booking',`data-id="${esc(b.id)}"`,'sm'));
    if(b.depositStatus==='held'&&b.checkOut<addDays(T,-2))add('warn',`Security deposit still held for ${b.guestName||'guest'} who left ${fday(b.checkOut)}.`,btn('Edit booking','edit-booking',`data-id="${esc(b.id)}"`,'sm'));
  }
  for(const t of S.tasks){
    if(t.status==='done'||t.type!=='turnover')continue;
    if(t.date<T)add('bad',`Cleaning not marked done for ${pname(t.propertyId)} since ${fday(t.date)}.`,btn('Housekeeping','go','data-view="jobs"','sm'));
    else if(t.date===T&&t.nextArrival===T)add('warn',`Same-day turnover in ${pname(t.propertyId)}: guests arrive ${ftime(t.nextArrivalTime)}.`,btn('Housekeeping','go','data-view="jobs"','sm'));
  }
  for(const b of active()){const ex=extrasOf(b);if(!ex.length)continue;
    const req=ex.filter(x=>x.status==='requested');if(req.length&&b.checkIn<=addDays(T,2)&&b.checkOut>=T)add('warn',`Confirm extras for ${b.guestName||'guest'}: ${req.map(x=>x.name).join(', ')}.`,btn('Open booking','edit-booking',`data-id="${esc(b.id)}"`,'sm'));
    const un=ex.filter(x=>!x.paid).reduce((s,x)=>s+(+x.total||0),0);if(un&&b.checkOut<=T)add('warn',`${money(un)} in extras or charges not yet paid by ${b.guestName||'guest'}.`,btn('Open booking','edit-booking',`data-id="${esc(b.id)}"`,'sm'));}
  const charge=S.issues.filter(i=>i.status!=='resolved'&&(i.category==='mess'||i.category==='damage')&&i.bookingId);
  if(charge.length)add('warn',`${plural(charge.length,'report')} of a messy or damaged room. Decide whether to charge the guest.`,btn('Maintenance','go','data-view="issues"','sm'));
  const over=S.schedules.filter(s=>schedStatus(s)[2]===0);
  if(over.length)add('warn',`${plural(over.length,'periodic care item')} overdue: ${over.slice(0,3).map(s=>s.name).join(', ')}${over.length>3?'…':''}.`,btn('Periodic care','go','data-view="schedule"','sm'));
  for(const l of S.licences){const st=licStatus(l);if(st[2]<=1)add(st[1]==='bad'?'bad':'warn',`${l.name}: ${st[0]}.`,btn('Licences','go','data-view="licences"','sm'));}
  const urgent=S.issues.filter(i=>i.status!=='resolved'&&(i.priority==='urgent'||i.category==='missing'));
  if(urgent.length)add('bad',`${plural(urgent.length,'urgent maintenance or missing-item report')} open.`,btn('Maintenance','go','data-view="issues"','sm'));
  const late=S.laundry.filter(l=>!l.returnedDate&&okDate(l.sentDate)&&diffDays(l.sentDate,T)>4);
  if(late.length)add('warn',`${plural(late.length,'laundry batch')} out for more than 4 days.`,btn('Laundry','go','data-view="laundry"','sm'));
  if(S.petty.length&&pettyBalance()<0)add('warn',`Petty cash is ${money(pettyBalance())}. Top it up.`,btn('Petty cash','go','data-view="petty"','sm'));
  return L.sort((a,b)=>(a.lvl==='bad'?0:1)-(b.lvl==='bad'?0:1));
}
function aptCard(p){

  const dirty=S.tasks.find(t=>t.propertyId===p.id&&t.type==='turnover'&&t.status!=='done'&&t.date<=T);
  const lastClean=S.tasks.filter(t=>t.propertyId===p.id&&t.type==='turnover'&&t.status==='done').sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))[0];
  let st,cls;

    <span class="kt-state" style="display:inline-flex;align-items:center;gap:6px"><span class="dot" style="color:var(--${cls})"></span>${esc(st)}</span></div>
   <div class="kt-body"><dl class="kv">
    <dt>In house</dt><dd>${inH?g(inH)+` <span class="muted">until ${esc(fday(inH.checkOut))}</span>`:'<span class="muted">Nobody</span>'}</dd>
    <dt>Next arrival</dt><dd>${next?g(next)+` <span class="muted">${esc(rday(next.checkIn))}</span>`:(arr&&!inH?g(arr):'<span class="muted">No upcoming booking</span>')}</dd>
    <dt>Cleaning</dt><dd>${dirty?pill(dirty.status==='in_progress'?'In progress':'Pending since '+fday(dirty.date),dirty.status==='in_progress'?'warn':'bad'):lastClean?'Done '+esc(fdt(lastClean.completedAt)):'<span class="muted">No cleaning recorded yet</span>'}</dd>
    <dt>Maintenance</dt><dd>${issues?pill(plural(issues,'open issue'),'warn'):'<span class="muted">No open issues</span>'}</dd>

   </dl>
   <div class="tacts">${btn('Add booking','new-booking',`data-prop="${esc(p.id)}"`,'sm primary')}${btn('Calendar','go','data-view="calendar"','sm')}</div></div></article>`;
}
function weekStrip(){
  const T=today();const dow=new Date(d2u(T)).getUTCDay();const mon=addDays(T,-((dow+6)%7));const W=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let h='<div class="week">';
  for(let i=0;i<7;i++){const d=addDays(mon,i);const pids=[...new Set(active().filter(b=>b.checkIn===d||b.checkOut===d).map(b=>b.propertyId))];
    h+=`<button type="button" class="wday${d===T?' on':''}" data-act="go-cal" data-date="${d}" aria-label="${esc(fday(d))}">${W[new Date(d2u(d)).getUTCDay()]}<b>${+d.slice(8)}</b><span class="dots">${pids.map(id=>`<i style="background:${tagOf(id).bg}"></i>`).join('')}</span></button>`;}
  return h+'</div>';
}
function agenda(){
  const T=today();let html='';const all=propList().map(p=>p.id);
  const row=(time,title,sub,pids)=>`<div class="arow"><span class="tchip">${esc(time)}</span><span class="at"><b>${title}</b><span>${sub}</span></span><span style="display:flex;gap:3px">${pids.map(id=>`<i class="sq" style="background:${tagOf(id).bg}"></i>`).join('')}</span></div>`;
  for(let i=0;i<7;i++){
    const d=addDays(T,i);const ev=[];
    active().filter(b=>b.checkOut===d).forEach(b=>{const t=S.tasks.find(x=>x.id==='turn-'+b.id);const tm=b.checkOutTime||'11:00';ev.push({k:tm,h:row(ftime(tm),'Check-out · '+esc(b.guestName||'Guest'),esc(pname(b.propertyId))+(t&&t.status==='done'?' · cleaned':''),[b.propertyId])});});
    active().filter(b=>b.checkIn===d).forEach(b=>{const tm=b.checkInTime||'14:00';ev.push({k:tm,h:row(ftime(tm),'Arrival · '+esc(b.guestName||'Guest'),esc(pname(b.propertyId))+' · '+plural(guestsOf(b),'guest')+' · '+esc(CHANNELS[b.channel]||'Other'),[b.propertyId])});});
    S.tasks.filter(t=>t.date===d&&!/^(turn|arr)-/.test(t.id)).forEach(t=>ev.push({k:t.time||'99',h:row(t.time?ftime(t.time):'Any time',esc(TTYPE[t.type]||'Job'),esc(pname(t.propertyId))+(t.note?' · '+esc(t.note):''),t.propertyId==='both'?all:[t.propertyId])}));
    S.schedules.filter(s=>schedNext(s)===d).forEach(s=>ev.push({k:'98',h:row('Due',esc(s.name),esc(pname(s.propertyId))+' · '+esc(WHO[s.who]||''),s.propertyId==='both'?all:[s.propertyId])}));
    ev.sort((a,b)=>a.k<b.k?-1:1);
    if(ev.length)html+=`<div class="day"><div class="dname">${esc(rday(d))}<small>${esc(fday(d))}</small></div>${ev.map(e=>e.h).join('')}</div>`;
  }
  return html?`<div class="agenda">${html}</div>`:'<p class="muted">Nothing scheduled in the next 7 days.</p>';
}

V.calendar=()=>{
  if(waiting('properties','bookings'))return loadingBox();
  const k=S.calMonth;const n=daysIn(k);const first=k+'-01';const last=k+'-'+String(n).padStart(2,'0');const T=today();const props=propList();
  if(!props.length)return vhead('Calendar')+empty('No apartments yet','Add an apartment first.',newRec('properties','Add apartment','primary'));
  const W=16;let g=`<div class="cal" style="grid-template-columns:150px repeat(${n*2},${W}px)">`;
  g+=`<div class="lab" style="grid-row:1;grid-column:1">Apartment</div>`;
  for(let i=0;i<n;i++){const d=addDays(first,i);const dow=new Date(d2u(d)).getUTCDay();const we=dow===0||dow===6;
    g+=`<div class="dh${we?' we':''}${d===T?' today':''}" style="grid-row:1;grid-column:${2+i*2}/span 2">${'SMTWTFS'[dow]}<b>${i+1}</b></div>`;}
  props.forEach((p,ri)=>{const r=ri+2;
    const occ=active().filter(b=>b.propertyId===p.id).reduce((s,b)=>{let c=0;for(let i=0;i<nightsOf(b);i++){if(addDays(b.checkIn,i).slice(0,7)===k)c++;}return s+c;},0);
    g+=`<div class="lab" style="grid-row:${r};grid-column:1">${esc(p.code||p.name)}<small><i class="sq" style="background:${tagOf(p.id).bg}"></i>${pct(occ/n)} booked</small></div>`;
    for(let i=0;i<n;i++){const d=addDays(first,i);const dow=new Date(d2u(d)).getUTCDay();const we=dow===0||dow===6;
      g+=`<button type="button" class="cell${we?' we':''}${d===T?' today':''}" style="grid-row:${r};grid-column:${2+i*2}/span 2" data-act="new-booking" data-prop="${esc(p.id)}" data-date="${d}" aria-label="New booking ${esc(p.name)} ${esc(fday(d))}"></button>`;}
    S.bookings.filter(b=>b.propertyId===p.id&&b.status!=='cancelled'&&okDate(b.checkIn)&&okDate(b.checkOut)&&b.checkOut>=first&&b.checkIn<=last).forEach(b=>{
      const s=b.checkIn<first?2:2+diffDays(first,b.checkIn)*2+1;const e=b.checkOut>last?2+n*2:2+diffDays(first,b.checkOut)*2+1;if(e<=s)return;
      const c=CHANNELS[b.channel]?b.channel:'other';
      g+=`<button type="button" class="bar ch-${c}" style="grid-row:${r};grid-column:${s}/${e}" data-act="edit-booking" data-id="${esc(b.id)}" title="${esc((b.guestName||'Guest')+' · '+fday(b.checkIn)+' – '+fday(b.checkOut))}">${esc(b.guestName||'Guest')}<small>${plural(nightsOf(b),'night')} · ${plural(guestsOf(b),'guest')}</small></button>`;});
  });
  g+='</div>';
  return vhead('Calendar','Tap an empty day to add a booking. Tap a booking to edit it.',btn('New booking','new-booking','','primary'))
   +monthNav('calMonth')+`<div class="cal-wrap">${g}</div>`
   +`<div class="legend">${Object.keys(CHANNELS).map(chip).join('')}<span>Bars start at check-in afternoon and end at check-out morning.</span></div>`;
};

function bookingItem(b){
  const T=today();const n=nightsOf(b);const fr=fRec(b.id);const fl=[bStatusPill(b)];
  if(b.paymentStatus==='pending'||b.paymentStatus==='partial')fl.push(pill(PAY[b.paymentStatus],'warn'));
  if(b.status!=='cancelled'&&b.checkOut>=T&&!b.idVerified)fl.push(pill('ID not verified','warn'));
  if(b.foreignNational)fl.push(pill(fr?.formCSubmitted?'Form C submitted':'Form C pending',fr?.formCSubmitted?'ok':'bad'));
  if(b.depositStatus&&b.depositStatus!=='none')fl.push(pill(DEP[b.depositStatus]+(b.deposit?' '+money(b.deposit):''),b.depositStatus==='held'?'honey':''));
  if(isBlocked(b))fl.push(pill('Do not host','bad'));
  {const ex=extrasOf(b);if(ex.length){const un=ex.filter(x=>!x.paid).reduce((s,x)=>s+(+x.total||0),0);fl.push(pill('+'+money(exTotal(b))+' extras'+(un?' · '+money(un)+' unpaid':''),un?'warn':'ok'));}}

function welcome(b){const p=S.props[b.propertyId]||{};const tpl=p.welcomeMessage||DEFAULT_WELCOME;

function guestIndex(){

  for(const b of S.bookings){const k=guestKey(b);let g=m.get(k);if(!g){g={key:k,name:b.guestName,phone:b.phone,email:b.email,bookings:[],last:''};m.set(k,g);}
    g.bookings.push(b);if((b.checkIn||'')>g.last){g.last=b.checkIn||'';g.name=b.guestName||g.name;g.phone=b.phone||g.phone;g.email=b.email||g.email;}}
  for(const g of m.values()){const a=g.bookings.filter(b=>b.status!=='cancelled');g.stays=a.length;g.nights=a.reduce((s,b)=>s+nightsOf(b),0);g.spend=a.reduce((s,b)=>s+(+b.total||0),0);
    g.channels=[...new Set(a.map(b=>b.channel))];const ids=new Set(g.bookings.map(b=>b.id));g.missing=S.issues.filter(i=>i.category==='missing'&&ids.has(i.bookingId)).length;g.profile=gProfile(g.key);g.foreign=g.bookings.some(b=>b.foreignNational);}

}

function taskCard(t){
  const T=today();const list=taskList(t);const checks=t.checks||{};const doneN=list.filter((_,i)=>checks['c'+i]).length;
  const overdue=t.status!=='done'&&t.date<T;const w=canW();
  const sp=t.status==='done'?pill('Done','ok'):t.status==='in_progress'?pill('In progress','warn'):overdue?pill('Overdue','bad'):pill('To do','');
  let when=esc(rday(t.date));if(t.type==='turnover')when+=' · after '+esc(ftime(t.time||'11:00'));else if(t.time)when+=' · '+esc(ftime(t.time));
  let det='';
  if(t.type==='turnover'){
    det+=`<div class="detail">${esc(t.guestName||'Guest')} leaves${t.guestsOut?' ('+plural(t.guestsOut,'guest')+')':''}.</div>`;
    det+=t.nextArrival?`<div class="detail">Next guests: <strong>${esc(rday(t.nextArrival))} ${esc(ftime(t.nextArrivalTime))}</strong> · ${plural(t.nextGuests||0,'guest')} ${t.nextArrival===t.date?pill('Same-day turnover','warn'):''}</div>`:'<div class="detail muted">No next booking yet.</div>';
    if(t.inventoryAt)det+=`<div class="detail">${t.missingCount?pill(plural(t.missingCount,'item')+' missing','bad'):pill('Inventory complete','ok')} <span class="muted">checked ${esc(fdt(t.inventoryAt))}</span></div>`;
  }else if(t.type==='arrival'){
    det+=`<div class="detail">Welcome <strong>${esc(t.guestName||'guest')}</strong> · ${plural(t.guests||0,'guest')} ${chip(t.channel)}</div>`;
    if(t.phone)det+=`<div class="detail">Guest phone: <span class="num" style="user-select:all">${esc(t.phone)}</span> ${btn('Copy','copy',`data-text="${esc(t.phone)}"`,'sm ghost')}</div>`;
    if(t.foreign)det+=`<div class="detail">${pill('Foreign guest','info')} Take copies of the passport photo page and visa.</div>`;
  }
  if(t.type==='arrival'&&t.extras&&t.extras.length){const notes=S.extras.filter(e=>e.setupNote&&t.extras.some(x=>x.endsWith(e.name)));det+=`<div class="detail">${pill('Set up','honey')} ${esc(t.extras.join(', '))}</div>`+notes.map(e=>`<div class="detail muted">${esc(e.name)}: ${esc(e.setupNote)}</div>`).join('');}
  if(t.type==='turnover'&&t.extrasReturn&&t.extrasReturn.length)det+=`<div class="detail">${pill('Collect & check','honey')} ${esc(t.extrasReturn.join(', '))}</div>`;
  if(t.type==='turnover'&&t.condition)det+=`<div class="detail">${t.condition==='ok'?pill('Room condition OK','ok'):pill(t.condition==='messy'?'Reported: room left messy':'Reported: damage','bad')}${t.conditionNote?' <span class="muted">'+esc(t.conditionNote)+'</span>':''}</div>`;
  if(t.note)det+=`<div class="detail"><span class="muted">Note:</span> ${esc(t.note)}</div>`;
  const open=S.open.has(t.id);
  const cl=list.length?`<div class="prog" aria-hidden="true"><i style="width:${list.length?Math.round(doneN/list.length*100):0}%"></i></div>
    <button type="button" class="btn sm ghost" data-act="task-toggle" data-id="${esc(t.id)}" aria-expanded="${open}">${open?'Hide':'Show'} checklist · ${doneN}/${list.length}</button>
    ${open?`<div class="checklist">${list.map((it,i)=>`<label class="checkrow"><input type="checkbox" data-check="${esc(t.id)}" data-i="${i}"${checks['c'+i]?' checked':''}${w?'':' disabled'}><span>${esc(it)}</span></label>`).join('')}</div>`:''}`:'';
  const notes=open||t.hkNotes?`<div class="field"><label for="tn-${esc(t.id)}">Housekeeper notes</label><textarea id="tn-${esc(t.id)}" rows="2" data-draft="${esc(t.id)}" placeholder="Anything the owner should know"${w?'':' disabled'}>${esc(S.drafts[t.id]??t.hkNotes??'')}</textarea>${w?`<div>${btn('Save note','task-note',`data-id="${esc(t.id)}"`,'sm')}</div>`:''}</div>`:'';
  const a=[];
  if(w){
    if(t.status==='pending')a.push(btn('Start','task-status',`data-id="${esc(t.id)}" data-s="in_progress"`,'sm'));
    if(t.status!=='done')a.push(btn('Mark done','task-status',`data-id="${esc(t.id)}" data-s="done"`,'sm primary'));
    if(t.status==='done')a.push(btn('Reopen','task-status',`data-id="${esc(t.id)}" data-s="pending"`,'sm ghost'));
    if(t.type==='turnover'&&!t.condition){a.push(btn('Room OK','cond',`data-id="${esc(t.id)}"`,'sm'));a.push(btn('Messy or damaged','cond-bad',`data-id="${esc(t.id)}"`,'sm danger'));}
    if(t.type==='turnover'&&countable(t.propertyId).length)a.push(btn(t.inventoryAt?'Recount inventory':'Inventory check','inventory',`data-id="${esc(t.id)}"`,'sm honey'));
    if(!open&&!t.hkNotes&&!list.length)a.push(btn('Add note','task-toggle',`data-id="${esc(t.id)}"`,'sm ghost'));
    if(mgr()&&!/^(turn|arr)-/.test(t.id))a.push(editRec('tasks',t.id,'Edit'));
  }
  const doneLine=t.status==='done'?`<div class="detail muted">Done ${esc(fdt(t.completedAt))} by ${who(t.completedBy)}</div>`:'';
  const tg=tagOf(t.propertyId);
  return `<article class="task${overdue?' overdue':''}"><div class="band" style="background:${tg.bg};color:${tg.fg}"><span class="bt"><span>${esc(TTYPE[t.type]||'Job')}</span><b>${esc(pname(t.propertyId))}</b></span>${sp}</div>
   <div class="tb"><span class="when">${when}</span>${det}${cl}${notes}${doneLine}${a.length?`<div class="tacts">${a.join('')}</div>`:''}</div></article>`;
}

     <section class="panel"><h3>By channel</h3><div class="tbl-wrap"><table><thead><tr><th>Channel</th><th class="r">Bookings</th><th class="r">Nights</th><th class="r">Value</th><th class="r">Commission</th></tr></thead><tbody>${Object.entries(f.byCh).length?Object.entries(f.byCh).map(([k,x])=>`<tr><td>${chip(k)}</td><td class="r">${x.ids.size}</td><td class="r">${x.n}</td><td class="r">${money(x.g)}</td><td class="r">${money(x.c)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No bookings this month.</td></tr>'}</tbody></table></div></section></div>`
   +`<section class="panel"><h3>Where the money went</h3>${cats.length?cats.map(([c,v])=>`<div class="hbar"><span class="lbl">${esc(c)}</span><span class="track"><i style="width:${Math.max(2,v/maxC*100)}%"></i></span><span class="num">${money(v)}</span></div>`).join(''):'<p class="muted">No expenses recorded this month.</p>'}</section>`;

function niceMax(v){if(v<=0)return 1000;const p=10**Math.floor(Math.log10(v));for(const m of[1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p;}
function chart(series){
  const W=720,H=240,L=58,R=10,Tp=12,B=28;const mx=niceMax(Math.max(...series.map(s=>Math.max(s.inc,s.exp)),0));
  const iw=W-L-R,ih=H-Tp-B;const gw=iw/series.length;const bw=Math.min(18,gw/2-4);const y=v=>Tp+ih-(Math.max(0,v)/mx)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net income and expenses for the last 12 months">`;
  for(let i=0;i<=4;i++){const v=mx*i/4;const yy=y(v);s+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${compact(v)}</text>`;}
  series.forEach((d,i)=>{const cx=L+gw*i+gw/2;
    s+=`<rect x="${cx-bw-1}" y="${y(d.inc)}" width="${bw}" height="${Tp+ih-y(d.inc)}" rx="3" style="fill:var(--tag2)"><title>${esc(monthLabel(d.m))}: net income ${money(d.inc)}</title></rect>`;
    s+=`<rect x="${cx+1}" y="${y(d.exp)}" width="${bw}" height="${Tp+ih-y(d.exp)}" rx="3" style="fill:var(--tag1)"><title>${esc(monthLabel(d.m))}: expenses ${money(d.exp)}</title></rect>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(monthShort(d.m))}</text>`;});
  return s+'</svg>';
}

function propOptions(val,both){const ps=propList();let h=ps.map(p=>`<option value="${esc(p.id)}"${p.id===val?' selected':''}>${esc(p.name)}</option>`).join('');if(both)h+=`<option value="both"${val==='both'?' selected':''}>Both apartments</option>`;return h;}
function fieldHtml(f,v){
  const id='f-'+f.k;let val=v;if(val==null||val==='')val=(typeof f.def==='function'?f.def():f.def);if(val==null)val='';
  const cls='field'+(f.w===2?' w2':'');const lab=`<label for="${id}">${esc(f.l)}${f.req?' <span class="req">*</span>':''}</label>`;const hint=f.hint?`<div class="hint">${esc(f.hint)}</div>`:'';
  const ph=f.ph?` placeholder="${esc(f.ph)}"`:'';
  switch(f.t){
    case 'textarea':return `<div class="${cls}">${lab}<textarea id="${id}" rows="${f.rows||3}"${ph}>${esc(val)}</textarea>${hint}</div>`;
    case 'lines':return `<div class="${cls}">${lab}<textarea id="${id}" rows="${f.rows||5}"${ph}>${esc(Array.isArray(val)?val.join('\n'):val)}</textarea>${hint}</div>`;
    case 'csv':return `<div class="${cls}">${lab}<input type="text" id="${id}" value="${esc(Array.isArray(val)?val.join(', '):val)}"${ph}>${hint}</div>`;
    case 'number':return `<div class="${cls}">${lab}<input type="number" id="${id}" inputmode="decimal" min="0" step="${f.step||'any'}" value="${esc(val)}"${ph}>${hint}</div>`;
    case 'money':return `<div class="${cls}">${lab}<input type="number" id="${id}" inputmode="numeric" min="0" step="1" value="${esc(val)}"${ph}>${hint}</div>`;
    case 'date':case 'time':return `<div class="${cls}">${lab}<input type="${f.t}" id="${id}" value="${esc(val)}">${hint}</div>`;
    case 'select':return `<div class="${cls}">${lab}<select id="${id}">${Object.entries(f.o).map(([k,l])=>`<option value="${esc(k)}"${String(k)===String(val)?' selected':''}>${esc(l)}</option>`).join('')}</select>${hint}</div>`;
    case 'prop':{const ps=propList();if(!val&&!f.both&&ps[0])val=ps[0].id;return `<div class="${cls}">${lab}<select id="${id}">${propOptions(val,f.both)}</select>${hint}</div>`;}
    case 'check':return `<div class="${cls}"><label class="checkrow"><input type="checkbox" id="${id}"${(v==null?f.def:v)?' checked':''}><span>${esc(f.l)}</span></label></div>`;
    case 'seg':return `<fieldset class="${cls}"><legend>${esc(f.l)}</legend><div class="segc">${Object.entries(f.o).map(([k,l])=>`<label class="segopt"><input type="radio" name="${id}" value="${esc(k)}"${String(k)===String(val)?' checked':''}><span>${esc(l)}</span></label>`).join('')}</div></fieldset>`;
    default:return `<div class="${cls}">${lab}<input type="text" id="${id}" value="${esc(val)}"${ph}>${hint}</div>`;
  }
}
function readField(f){
  const id='f-'+f.k;const el=document.getElementById(id);
  switch(f.t){
    case 'check':return!!(el&&el.checked);
    case 'seg':{const r=document.querySelector(`input[name="${id}"]:checked`);return r?r.value:f.def;}
    case 'number':case 'money':{const s=el.value.trim();return s===''?null:Number(s);}
    case 'lines':return el.value.split('\n').map(x=>x.trim()).filter(Boolean);
    case 'csv':return el.value.split(',').map(x=>x.trim()).filter(Boolean);
    default:return el.value.trim();
  }
}
function sheetHead(t){return `<div class="sheet-head"><h2 id="sheetTitle">${esc(t)}</h2><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>`;}
function sheetFoot(left,save){return `<div class="sheet-foot">${left||''}<span class="grow"></span><button type="button" class="btn ghost" data-act="close">Cancel</button>${save?`<button type="submit" class="btn primary" id="saveBtn">${esc(save)}</button>`:''}</div>`;}
function warnIn(id,msg){const el=document.getElementById(id);if(!el)return;el.textContent=msg;el.hidden=!msg;}
function openRecord(coll,id,opts){
  opts=opts||{};const sc=SCHEMAS[coll];if(!sc)return;const rec=id?findRec(coll,id):null;
  const v={...(opts.preset||{}),...(rec?stripId(rec):{}),...(opts.override||{})};
  const title=opts.title||(rec?'Edit '+sc.noun:'Add '+sc.noun);
  const canDel=rec&&opts.del!==false&&(S.isOwner||coll==='issues'&&!rec);
  openSheet(`<form id="recForm" novalidate>${sheetHead(title)}<div class="sheet-body">${opts.top||''}<div class="fgrid">${sc.fields.map(f=>fieldHtml(f,v[f.k])).join('')}</div><div class="formwarn" id="recWarn" hidden></div></div>${sheetFoot(canDel?`<button type="button" class="btn ghost danger" data-act="rec-del" data-coll="${coll}" data-id="${esc(id)}">Delete</button>`:'','Save')}</form>`);
  $('#recForm').addEventListener('submit',async e=>{
    e.preventDefault();const vals={};
    for(const f of sc.fields){vals[f.k]=readField(f);if(f.req&&(vals[f.k]===''||vals[f.k]==null)){warnIn('recWarn',f.l+' is required.');document.getElementById('f-'+f.k)?.focus();return;}}
    if(opts.validate){const m=opts.validate(vals);if(m){warnIn('recWarn',m);return;}}
    const now=Date.now();const rid=id||opts.newId||uid(sc.prefix);const doc={...(rec?stripId(rec):{}),...(opts.extra||{}),...vals,updatedAt:now};
    if(!rec){doc.createdAt=now;doc.createdBy=S.myId||null;}
    const sb=$('#saveBtn');if(sb)sb.disabled=true;
    try{await saveDoc(coll,rid,doc);closeSheet();toast(opts.saved||(rec?'Saved':'Added'));if(opts.after)await opts.after(rid,doc,rec);}
    catch(err){writeErr(err);if(sb)sb.disabled=false;}
  });
}

/* ---------- shell rendering ---------- */
function badge(k){
  const T=today();let n=0;
  if(k==='jobs')n=S.tasks.filter(t=>t.status!=='done'&&t.date<=T).length;
  else if(k==='schedule')n=S.schedules.filter(s=>schedStatus(s)[2]===0).length;
  else if(k==='issues')n=S.issues.filter(i=>i.status!=='resolved').length;
  else if(k==='foreign')n=S.bookings.filter(b=>b.foreignNational&&b.status!=='cancelled'&&!fRec(b.id)?.formCSubmitted&&b.checkIn<=addDays(T,1)&&b.checkOut>=addDays(T,-1)).length;
  else if(k==='licences')n=S.licences.filter(l=>licStatus(l)[2]<=1).length;
  else if(k==='laundry')n=S.laundry.filter(l=>!l.returnedDate).length;
  return n?`<span class="count">${n}</span>`:'';
}

  $('#side').innerHTML=nav.map(([g,items])=>`<div class="navgroup"><h4>${esc(g)}</h4>${items.map(([k,l])=>`<button type="button" class="navitem" data-act="go" data-view="${k}"${S.view===k?' aria-current="page"':''}><span>${esc(l)}</span>${badge(k)}</button>`).join('')}</div>`).join('');
  const cur=navFlat().find(x=>x[0]===S.view);$('#mcur').textContent=cur?cur[1]:'';
  const bb=mgr()?BB_OWNER:BB_HK;const inBar=bb.some(x=>x[0]===S.view);
  $('#bottombar').innerHTML=bb.map(([k,l,ic])=>k==='more'?`<button type="button" class="bb" data-act="menu"${inBar?'':' aria-current="page"'}>${ICON[ic]}<span>${esc(l)}</span></button>`
    :`<button type="button" class="bb" data-act="go" data-view="${k}"${S.view===k?' aria-current="page"':''}>${ICON[ic]}<span>${esc(l)}</span>${badge(k)}</button>`).join('');
}
function renderTop(){
  $('#clock').textContent='Kochi '+_clk.format(new Date());
  $('#role').innerHTML=S.roleReady?(S.isOwner?(S.preview?pill('Housekeeper view','honey'):pill('Owner','info')):pill('Housekeeping','honey')):'';
  $('#previewSlot').innerHTML=S.isOwner?btn(S.preview?'Back to owner view':'View as housekeeper','preview','','sm ghost'):'';
}
function renderBanner(){
  let m='';
  if(S.noRuntime)m='Open this page in Claude to load and save your apartment data.';
  else if(S.noDb)m='Saved data is not available in this view. Open the page from your Claude artifacts.';
  else if(S.stale)m="Can't reach your saved data yet. What you see may be out of date; it will refresh on its own.";
  else if(Object.keys(S.errors).length)m='Some data could not be loaded. Reload the page to try again.';
  else if(S.roleReady&&!S.isOwner&&(S.canWrite===false||S.readOnly))m="You can view this page but can't update it. Ask the owner to give you Editor access.";
  $('#banner').innerHTML=m?`<div class="banner">${esc(m)}</div>`:'';
}
function render(){
  if(!S.view){const h=(location.hash||'').slice(1);S.view=h||null;}
  const ok=navFlat().map(x=>x[0]);if(!ok.includes(S.view))S.view=ok[0];
  renderTop();renderNav();renderBanner();
  const main=$('#main');const a=document.activeElement;let keep=null;
  if(a&&a.id&&main.contains(a))keep={id:a.id,s:a.selectionStart,e:a.selectionEnd};
  let html;
  if(!S.roleReady)html=loadingBox('Opening your apartments…');
  else if(S.noRuntime||S.noDb)html=empty('Your apartment manager','Open this page inside Claude to see bookings, housekeeping and finance.');
  else html=(V[S.view]||V.today)();
  main.innerHTML=html;
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{if(keep.s!=null)el.setSelectionRange(keep.s,keep.e);}catch(e){}}}
  fillNames();
}
let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();});}
async function fillNames(){
  if(!S.user)return;const els=[...document.querySelectorAll('[data-uid]')];if(!els.length)return;
  const ids=[...new Set(els.map(e=>e.dataset.uid))];
  try{const ps=await S.user.profiles(ids);els.forEach(e=>{const p=ps[e.dataset.uid];e.textContent=p&&p.isMe?'you':(p&&p.name)||'someone';});}catch(e){}
}
function setView(v,push){
  S.view=v;const ok=navFlat().map(x=>x[0]);if(!ok.includes(S.view))S.view=ok[0];
  if(push){try{if(location.hash!=='#'+S.view)location.hash=S.view;}catch(e){}}
  render();try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener('hashchange',()=>{const v=(location.hash||'').slice(1);if(v&&v!==S.view)setView(v,false);});
function openSheet(html){$('#sheet').innerHTML=html;$('#modal').hidden=false;document.body.style.overflow='hidden';}
function closeSheet(){$('#modal').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow='';}
function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='bad'?6000:3200);}
function armDelete(a,fn){if(a.dataset.armed==='1'){fn();return;}a.dataset.armed='1';a.textContent='Tap again to delete';setTimeout(()=>{if(a.isConnected){a.dataset.armed='';a.textContent='Delete';}},4000);}

/* ---------- events ---------- */
const H={
  go:a=>setView(a.dataset.view,true),
  'go-cal':a=>{S.calMonth=a.dataset.date.slice(0,7);setView('calendar',true);},
  nav:a=>{closeSheet();setView(a.dataset.view,true);},
  menu:()=>openNav(),
  preview:()=>{S.preview=!S.preview;setView(S.view,true);toast(S.preview?'Showing what your housekeeper sees':'Back to owner view');},
  close:()=>closeSheet(),
  filter:a=>{S[a.dataset.key]=a.dataset.val;render();},
  month:a=>{const k=a.dataset.key,d=+a.dataset.d;S[k]=d===0?today().slice(0,7):addMonths(S[k],d);render();},
  'new-booking':a=>{closeSheet();openBooking(null,{propertyId:a.dataset.prop,date:a.dataset.date});},
  'edit-booking':a=>{closeSheet();openBooking(a.dataset.id);},
  'b-status':a=>setBookingStatus(a.dataset.id,a.dataset.s),
  'copy-welcome':a=>{const b=S.bookings.find(x=>x.id===a.dataset.id);if(b)copyText(welcome(b),'Welcome message copied');},
  copy:a=>copyText(a.dataset.text,'Copied'),
  export:a=>exportCSV(a.dataset.what),
  'rec-new':a=>{let p=null;try{p=a.dataset.preset?JSON.parse(a.dataset.preset):null;}catch(e){}openRecord(a.dataset.coll,null,{preset:p});},
  'rec-edit':a=>openRecord(a.dataset.coll,a.dataset.id,{del:a.dataset.del!=='0'}),
  'rec-del':a=>armDelete(a,()=>deleteRecord(a.dataset.coll,a.dataset.id)),
  'del-booking':a=>armDelete(a,()=>deleteRecord('bookings',a.dataset.id)),
  'task-toggle':a=>{const id=a.dataset.id;if(S.open.has(id))S.open.delete(id);else S.open.add(id);render();},
  'task-status':async a=>{const id=a.dataset.id,s=a.dataset.s;const now=Date.now();const patch={status:s};
    if(s==='done'){patch.completedAt=now;patch.completedBy=S.myId||null;S.open.delete(id);}else if(s==='in_progress'){patch.startedAt=now;S.open.add(id);}else patch.completedAt=null;
    if(await patchDoc('tasks',id,patch))toast(s==='done'?'Job done':s==='in_progress'?'Started':'Reopened');},
  'task-note':async a=>{const id=a.dataset.id;const val=(S.drafts[id]??document.getElementById('tn-'+id)?.value??'').trim();
    if(await patchDoc('tasks',id,{hkNotes:val,notedAt:Date.now()})){delete S.drafts[id];toast('Note saved');render();}},
  inventory:a=>openInventory(a.dataset.id),
  'sched-done':a=>openSchedDone(a.dataset.id),
  'sched-hist':a=>{const id=a.dataset.id;if(S.schedOpen.has(id))S.schedOpen.delete(id);else S.schedOpen.add(id);render();},
  'laundry-return':a=>{const l=S.laundry.find(x=>x.id===a.dataset.id);openRecord('laundry',a.dataset.id,{override:{returnedDate:today(),itemsReturned:l&&l.itemsReturned!=null?l.itemsReturned:(l?l.itemsSent:null)},title:'Mark laundry returned',del:false});},
  'issue-resolve':a=>openResolve(a.dataset.id),
  'issue-reopen':async a=>{if(await patchDoc('issues',a.dataset.id,{status:'open',resolvedAt:null}))toast('Reopened');},
  guest:a=>openGuest(a.dataset.key),
  foreign:a=>{closeSheet();openForeign(a.dataset.id);},
  cond:async a=>{if(await patchDoc('tasks',a.dataset.id,{condition:'ok',conditionAt:Date.now()}))toast('Room condition saved');},
  'cond-bad':a=>openCondition(a.dataset.id),
  'x-paid':async a=>{await patchExtra(a.dataset.bid,a.dataset.k,{paid:true});},
  'x-status':async a=>{await patchExtra(a.dataset.bid,a.dataset.k,{status:a.dataset.s});},
  'review-asked':async a=>{if(await patchDoc('bookings',a.dataset.id,{reviewAsked:true}))toast('Marked as asked');}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=H[a.dataset.act];if(f){e.preventDefault();f(a,e);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.item[data-act]')){e.preventDefault();e.target.click();}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});
document.addEventListener('change',async e=>{
  const el=e.target;if(!el.matches||!el.matches('[data-check]'))return;
  const id=el.dataset.check,i=el.dataset.i;const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const patch={checks:{['c'+i]:el.checked}};if(t.status==='pending')patch.status='in_progress';
  if(!(await patchDoc('tasks',id,patch)))el.checked=!el.checked;
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.draft!=null){S.drafts[el.dataset.draft]=el.value;}
  else if(el.dataset&&el.dataset.search){S[el.dataset.search]=el.value;render();}
});

/* ---------- start ---------- */
async function init(){
  render();
  setInterval(()=>{const d=today();if(d!==S._day){S._day=d;render();}else renderTop();},30000);S._day=today();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){S.noRuntime=true;S.roleReady=true;render();return;}
  const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
  S.db=db;S.user=user;
  if(user){try{S.isOwner=await user.isOwner();S.canWrite=await user.can('data.write');S.myId=await user.id();}catch(e){}}
  S.roleReady=true;
  if(!db){S.noDb=true;render();return;}
  const subs=['properties'].concat(SHARED);if(S.isOwner)subs.push(...PRIVATE);
  const pending=new Set(subs);
  const timer=setTimeout(()=>{if(pending.size){S.stale=true;scheduleRender();}},10000);
  subs.forEach(name=>{
    try{db.collection(name).onSnapshot(snap=>{
      const rows=snap.docs.map(d=>({...d.data(),id:d.id}));
      if(name==='properties'){const m={};rows.forEach(r=>{m[r.id]=r;});S.props=m;}else S[name]=rows;
      S.loaded[name]=true;
      if(!snap.metadata.fromCache){pending.delete(name);if(!pending.size){clearTimeout(timer);S.stale=false;}}
      scheduleRender();
    },err=>{pending.delete(name);S.loaded[name]=true;S.errors[name]=err&&err.code;if(!pending.size)clearTimeout(timer);scheduleRender();});}
    catch(e){S.loaded[name]=true;S.errors[name]='failed';}
  });
  render();
  c.use('downloads').then(d=>{S.downloads=d;}).catch(()=>{});
}
init();
})();
</script>
