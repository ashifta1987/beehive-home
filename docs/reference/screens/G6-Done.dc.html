<helmet>

<style>
body{margin:0}
a{color:#4646E0}a:hover{color:#2F2FB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #4646E0; color: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <section style="padding: 54px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">

    <h1 style="margin: 6px 0 0; font-family: 'Unbounded', sans-serif; font-size: 27px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15">You're checked in, Sarah</h1>
    <p style="margin: 0; font-size: 15px; opacity: 0.9; max-width: 30ch">Your host has your details. Enjoy Kochi!</p>
  </section>

  <section style="margin: 28px 16px 0; background: #FFFFFF; color: #15171C; border-radius: 26px; overflow: hidden">
    <div style="padding: 16px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; border-bottom: 1px solid #ECEEF2">
      <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #555B66">Apartment</span><span style="font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 800">2BHK</span></span>
      <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #555B66">Check-out</span><span style="font-size: 15px; font-weight: 700">Sun 15 Nov, 11 AM</span></span>
    </div>
    <div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #ECEEF2">
      <span style="font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/></svg>Wi-Fi</span>
      <div style="display: flex; justify-content: space-between; align-items: center; background: #F4F5F8; border-radius: 14px; padding: 10px 12px"><span style="display: flex; flex-direction: column"><span style="font-size: 11px; color: #555B66">Network</span><span style="font-size: 14px; font-weight: 600">[Wi-Fi name]</span></span><span style="display: flex; flex-direction: column"><span style="font-size: 11px; color: #555B66">Password</span><span style="font-size: 14px; font-weight: 600">[password]</span></span><button type="button" style="all: unset; cursor: pointer; font-size: 13px; font-weight: 700; color: #4646E0; padding: 8px 4px">Copy</button></div>
    </div>
    <div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700">Next</span>
      <span style="font-size: 14px; display: flex; gap: 10px; align-items: center"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFC542; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex: none">1</span>Our housekeeper meets you with the keys</span>
      <span style="font-size: 14px; display: flex; gap: 10px; align-items: center"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFC542; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex: none">2</span>Show your original ID at the door</span>
    </div>
  </section>

  <span style="flex: 1"></span>
  <div style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <a href="https://wa.me/" style="text-decoration: none; min-height: 58px; border-radius: 20px; background: #15171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC542" stroke-width="2" aria-hidden="true"><path d="M4 20l1.5-4A8 8 0 1 1 9 19.5z"/></svg>Message your host</a>
    <a href="G1-Welcome.dc.html" style="text-align: center; font-size: 13px; color: #FFFFFF; opacity: 0.9; padding: 8px">Check in another guest</a>
